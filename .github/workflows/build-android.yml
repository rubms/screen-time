name: Build Android agent

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "apps/android-agent/**"
      - "packages/**"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install SDK packages
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
      - name: Assemble release
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ ! -f apps/android-agent/gradlew ]; then
            echo "android-agent not present; skipping"
            exit 0
          fi
          chmod +x apps/android-agent/gradlew
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > /tmp/keystore.jks
            export RELEASE_STORE_FILE=/tmp/keystore.jks
          fi
          apps/android-agent/gradlew -p apps/android-agent assembleRelease
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-agent-release
          path: apps/android-agent/**/build/outputs/apk/**/*.apk
          if-no-files-found: warn
